services:
  mongo:
    image: mongo
    restart: always
    ports: 
    - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
  
  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/
      ME_CONFIG_BASICAUTH: false

  movie:
    build: ./movie/
    ports:
      - "3001:3001"
    volumes:
      - movie_data:/app/data
    depends_on:
      mongo:
        condition: service_healthy

  schedule:
    build: ./schedule/
    ports:
      - "3002:3002"
    environment:
      MOVIE_URL: http://movie:3001
    volumes:
      - schedule_data:/app/data
    depends_on:
      - movie

  booking:
    build: ./booking/
    ports:
      - "3003:3003"
    environment:
      MOVIE_URL: http://movie:3001
      SCHEDULE_URL: http://schedule:3002
    volumes:
      - booking_data:/app/data
    depends_on:
      movie:
        condition: service_started
      schedule:
        condition: service_started
      mongo:
        condition: service_healthy

  user:
    build: ./user/
    ports:
      - "3004:3004"
    volumes:
      - user_data:/app/data

volumes:
  movie_data:
  schedule_data:
  booking_data:
  user_data:
