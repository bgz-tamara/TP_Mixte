services:
  # movie:
  #   build: ./movie/
  #   ports:
  #     - "3200:3200"
  mongo:
    image: mongo
    restart: always
    ports: 
    - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/
      ME_CONFIG_BASICAUTH: false

      - "3001:3001"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-this}
    volumes:
      - movie_data:/app/data

  schedule:
    build: ./schedule/
    ports:
      - "3002:3002"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-this}
      MOVIE_URL: http://movie:3001
    volumes:
      - schedule_data:/app/data
    depends_on:
      - movie

  booking:
    build: ./booking/
    ports:
      - "3003:3003"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-this}
      MOVIE_URL: http://movie:3001
      SCHEDULE_URL: http://schedule:3002
    volumes:
      - booking_data:/app/data
    depends_on:
      - movie
      - schedule

  user:
    build: ./user/
    ports:
      - "3004:3004"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-this}
    volumes:
      - user_data:/app/data

volumes:
  movie_data:
  schedule_data:
  booking_data:
  user_data:
